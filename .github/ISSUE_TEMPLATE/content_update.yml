name: Content Update
description: Request a lesson, phrase, pinyin, Chinese, or English content change.
title: "[Content]: "
labels: ["content"]
body:
  - type: input
    id: unit
    attributes:
      label: Unit
      placeholder: Unit 4
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      placeholder: Replace the Chinese or English example sentence with something easier.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this helps
      placeholder: This phrase is more useful for daily practice.
